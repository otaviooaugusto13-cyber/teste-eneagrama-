<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>PráticaMente — Diagnóstico Premium</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="app">
  <img src="logo.png" class="logo">
  <h1>Diagnóstico PráticaMente</h1>
  <p class="subtitle">PNL • Eneagrama • Estoicismo • Andragogia</p>

  <div id="progress-container">
    <div id="progress-bar"></div>
  </div>

  <div id="question-card">
    <h2 id="question-text"></h2>
    <div class="options">
      <button onclick="answer(1)">Discordo totalmente</button>
      <button onclick="answer(2)">Discordo</button>
      <button onclick="answer(3)">Neutro</button>
      <button onclick="answer(4)">Concordo</button>
      <button onclick="answer(5)">Concordo totalmente</button>
    </div>
  </div>

  <div id="result-card" class="hidden">
    <h2>Seu Perfil PráticaMente</h2>

    <h3 id="result-type"></h3>
    <p id="wing"></p>
    <p id="instinct"></p>

    <div class="box"><h4>🌱 Origem Emocional</h4><p id="origin"></p></div>
    <div class="box"><h4>🧠 Trauma Nuclear</h4><p id="trauma"></p></div>
    <div class="box"><h4>⚠️ Padrão de Regressão</h4><p id="regression"></p></div>
    <div class="box"><h4>🚀 Caminho de Evolução</h4><p id="evolution"></p></div>
    <div class="box"><h4>✨ Potenciais Elevados</h4><p id="strengths"></p></div>
    <div class="box"><h4>🧩 Direção PráticaMente</h4><p id="praticamente"></p></div>

    <button class="download" onclick="generatePDF()">Baixar Relatório em PDF</button>
  </div>
</div>

<script src="script.js"></script>
</body>
</html>
