<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>PráticaMente — Análise de Perfil</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="app">
    <img src="logo.png" class="logo" alt="PráticaMente">
    <h1>Análise de Perfil PráticaMente</h1>
    <p class="subtitle">Autoconhecimento prático para evolução real</p>

    <div id="progress-container">
      <div id="progress-bar"></div>
    </div>

    <div id="question-card">
      <h2 id="question-text"></h2>

      <div class="options">
        <button onclick="answer(1)">Discordo totalmente</button>
        <button onclick="answer(2)">Discordo</button>
        <button onclick="answer(3)">Neutro</button>
        <button onclick="answer(4)">Concordo</button>
        <button onclick="answer(5)">Concordo totalmente</button>
      </div>
    </div>

    <div id="result-card" class="hidden">
      <h2>Seu Resultado PráticaMente</h2>
      <h3 id="result-type"></h3>

      <div class="box">
        <h4>✨ Pontos Fortes</h4>
        <p id="strengths"></p>
      </div>

      <div class="box">
        <h4>⚠️ Pontos de Atenção</h4>
        <p id="weaknesses"></p>
      </div>

      <div class="box">
        <h4>🚀 Onde Você Pode Evoluir</h4>
        <p id="evolution"></p>
      </div>

      <div class="box">
        <h4>🧠 Direção PráticaMente  
        (PNL + Eneagrama + Estoicismo)</h4>
        <p id="praticamente"></p>
      </div>

      <button class="download" onclick="alert('PDF será gerado aqui')">
        Baixar Relatório em PDF
      </button>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
