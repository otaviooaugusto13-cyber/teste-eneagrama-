<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8" />
  <title>Diagnóstico PráticaMente</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

<div class="container">

  <h1>Diagnóstico PráticaMente</h1>
  <p>Responda com sinceridade. Não pense demais.</p>

  <form id="quizForm">
    <div id="questions"></div>
    <button type="submit">Ver meu Perfil</button>
  </form>

  <div id="result" class="hidden">
    <h2 id="profileTitle"></h2>
    <p id="profileDescription"></p>

    <div id="details"></div>

    <h3>🧠 Seu Mapa Emocional</h3>
    <div id="mindmap"></div>

    <div id="feedbackBlock">
      <h3>📥 Para baixar seu PDF</h3>
      <p>Antes, nos dê sua opinião rápida:</p>

      <textarea id="feedback" placeholder="O que achou das perguntas e do seu diagnóstico?"></textarea>
      <select id="clarity">
        <option value="">O quão claro foi para você?</option>
        <option value="5">Muito claro</option>
        <option value="4">Claro</option>
        <option value="3">Mais ou menos</option>
        <option value="2">Confuso</option>
        <option value="1">Nada claro</option>
      </select>

      <select id="recommend">
        <option value="">Você indicaria para alguém?</option>
        <option value="sim">Sim</option>
        <option value="talvez">Talvez</option>
        <option value="nao">Não</option>
      </select>

      <button type="button" id="unlockPdf">Liberar PDF</button>
    </div>

    <div id="pdfBlock" class="hidden">
      <a href="#" id="downloadPdf">📄 Baixar meu PDF</a>
    </div>

  </div>

</div>

<script src="script.js"></script>
</body>
</html>
