<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>Teste PráticaMente</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">
  <h1>Seu Resultado PráticaMente</h1>

  <div id="resultado"></div>

  <button id="btnPdf">Baixar Relatório em PDF</button>
</div>

<!-- MODAL PROVA SOCIAL -->
<div id="modalProva" class="modal">
  <div class="modal-content">
    <h2>Antes de liberar seu relatório completo…</h2>

    <input type="text" id="nome" placeholder="Seu nome">
    <input type="text" id="contato" placeholder="Seu WhatsApp ou Email">

    <label>Avaliação:</label>
    <select id="avaliacao">
      <option value="">Selecione</option>
      <option value="5">⭐⭐⭐⭐⭐</option>
      <option value="4">⭐⭐⭐⭐</option>
      <option value="3">⭐⭐⭐</option>
      <option value="2">⭐⭐</option>
      <option value="1">⭐</option>
    </select>

    <textarea id="comentario" placeholder="O que você achou desse diagnóstico?"></textarea>
    <textarea id="clareza" placeholder="Isso te trouxe clareza sobre você?"></textarea>
    <textarea id="indicaria" placeholder="Você indicaria isso para alguém?"></textarea>

    <button id="liberarPdf">Liberar meu relatório completo</button>
  </div>
</div>

<script src="script.js"></script>
</body>
</html>
